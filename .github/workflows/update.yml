name: Update case index

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Mapped here because the secrets context can't be read inside a step "if".
      COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch DOJ press releases
        run: node scripts/fetch.js
        env:
          WINDOW_DAYS: "730"
          MAX_PAGES: "20"
          ONLY_SENTENCED: "true"

      - name: Rebuild the sentences data
        run: node scripts/build.js

      - name: Fetch civil dockets and filings
        if: env.COURTLISTENER_TOKEN != ''
        run: node scripts/fetch-civil.js
        env:
          MAX_REQUESTS: "45"
          SPACING_MS: "75000"

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "Update index"
          git push
